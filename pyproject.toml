[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pseudoguard-studio"
version = "1.0.0"
description = "Human-AI object-detection annotation with proposal validation and count-guided acceptance"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = ["pillow>=10.0"]

[project.optional-dependencies]
train = ["torch>=2.0", "torchvision>=0.15", "ultralytics>=8.3", "numpy>=1.24",
         "pyyaml>=6.0", "tqdm>=4.65", "scikit-learn>=1.3", "opencv-python-headless>=4.8"]
dev = ["pytest>=7.4"]

[project.scripts]
pglabel = "pglabel.desktop:main"

[tool.setuptools]
packages = ["pglabel", "pgcount", "pgcount.adapters", "pseudoguard", "pseudoguard.data",
            "pseudoguard.models", "pseudoguard.models.detection",
            "pseudoguard.models.classification", "pseudoguard.utils", "tools"]

[tool.setuptools.package-data]
pglabel = ["static/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
